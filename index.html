<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wololo.top - Age of Empires II Player Stats</title>
    <!-- Lo de aqui es lo que vale para TODO el sitio. El titulo, la
         descripcion, la canonica y las og de cada pagina las escribe
         scripts/prerender-meta.mjs al compilar, porque los crawlers
         sociales no ejecutan JavaScript y no verian las de Helmet. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="wololo.top" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#0b0a08" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="wololo.top" />
    <!-- La canonica y la descripcion las pone cada pagina con Helmet.
         Estaban tambien aqui, y react-helmet-async no las reemplaza: las
         añade al lado. Dos canonicas por pagina = Google ignora ambas.
         Una pagina nueva tiene que traer su Helmet. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "wololo.top",
      "url": "https://wololo.top",
      "description": "Age of Empires II player statistics, match history, civilization meta, and head-to-head analysis.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://wololo.top/player/{search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
